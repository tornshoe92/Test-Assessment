# Run against PostgreSQL instead of in-memory H2:
#   SPRING_PROFILES_ACTIVE=postgres ./mvnw spring-boot:run
spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/notes}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:notes}
    password: ${POSTGRES_PASSWORD:notes}

  jpa:
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: false
